<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="holoGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="960" height="520" rx="16" fill="url(#bgGrad)"/>
  <text x="480" y="34" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="800" font-family="Microsoft YaHei, PingFang SC, sans-serif">Pepper's Ghost（佩珀尔幻象）45° 成像光学原理 &amp; 塑料瓶全息罩裁切尺寸</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-family="Microsoft YaHei, sans-serif">光学原理对照 Wikimedia Commons：Pepper's Ghost 虚像反射定律（入射角 = 反射角 ≈ 45°，4 片等腰梯形组合成倒置四棱台）</text>

  <!-- 左侧：光学反射剖面原理图 -->
  <rect x="24" y="76" width="470" height="418" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="104" fill="#38bdf8" font-size="15" font-weight="800" font-family="Microsoft YaHei, sans-serif">一、45° 光学虚像成像侧视光路图（实屏像素 → 悬浮虚像）</text>

  <!-- 平放手机与黑底发光屏 -->
  <rect x="110" y="395" width="320" height="28" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="128" y="391" width="284" height="6" rx="2" fill="#020617"/>
  <!-- 手机屏幕两个亮像素发光区 -->
  <line x1="168" y1="391" x2="218" y2="391" stroke="#38bdf8" stroke-width="5"/>
  <line x1="322" y1="391" x2="372" y2="391" stroke="#38bdf8" stroke-width="5"/>
  <text x="270" y="414" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" font-family="Microsoft YaHei, sans-serif">手机平放桌面（全黑背景 + 四周对称高亮度像素图）</text>

  <!-- 倒置梯形全息塑料罩剖面 (小底 1cm 在下，大底 6cm 在上，折合倾角 44.4° ≈ 45°) -->
  <polygon points="244,391 296,391 398,255 142,255" fill="url(#filmGrad)" stroke="#7dd3fc" stroke-width="2.5"/>
  <!-- 高度与口径标尺 -->
  <line x1="138" y1="242" x2="402" y2="242" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="270" y="234" text-anchor="middle" fill="#fde047" font-size="12" font-weight="800" font-family="Microsoft YaHei, sans-serif">上开口宽 6 cm（四片拼合大口朝上）</text>
  <line x1="244" y1="436" x2="296" y2="436" stroke="#4ade80" stroke-width="2"/>
  <text x="270" y="454" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="800" font-family="Microsoft YaHei, sans-serif">贴屏小底 1 cm</text>

  <!-- 44.4° 倾角标注 -->
  <path d="M 244,391 A 36,36 0 0,0 218,365" fill="none" stroke="#facc15" stroke-width="2"/>
  <text x="172" y="378" text-anchor="end" fill="#facc15" font-size="11.5" font-weight="800" font-family="Microsoft YaHei, sans-serif">≈44.4°</text>

  <!-- 光路反射射线 -->
  <line x1="193" y1="391" x2="193" y2="323" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <line x1="193" y1="323" x2="72" y2="323" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <!-- 虚像延长线 -->
  <line x1="193" y1="323" x2="262" y2="323" stroke="#fde047" stroke-width="2" stroke-dasharray="5 4"/>

  <line x1="347" y1="391" x2="347" y2="323" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <line x1="347" y1="323" x2="452" y2="323" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <line x1="347" y1="323" x2="278" y2="323" stroke="#fde047" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 中央悬浮全息虚像小人 -->
  <circle cx="270" cy="316" r="24" fill="#38bdf8" fill-opacity="0.16" stroke="#fde047" stroke-width="1.5" stroke-dasharray="3 2"/>
  <rect x="261" y="302" width="18" height="14" rx="4" fill="#d99a88"/>
  <rect x="259" y="300" width="22" height="5" rx="2" fill="#392e48"/>
  <rect x="262" y="316" width="16" height="13" rx="2" fill="#2563eb"/>
  <text x="270" y="352" text-anchor="middle" fill="#fde047" font-size="12" font-weight="800" font-family="Microsoft YaHei, sans-serif">✨ 悬浮虚像（肉眼看见位置）</text>

  <!-- 观察者眼睛（左侧） -->
  <ellipse cx="52" cy="323" rx="14" ry="9" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="55" cy="323" r="4.5" fill="#0f172a"/>
  <text x="54" y="304" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="700" font-family="Microsoft YaHei, sans-serif">平视人眼</text>

  <!-- 垂直高度标记 -->
  <line x1="422" y1="255" x2="422" y2="391" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="454" y="318" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="700" font-family="Microsoft YaHei, sans-serif">立高</text>
  <text x="454" y="335" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="800" font-family="Microsoft YaHei, sans-serif">≈2.45 cm</text>

  <text x="44" y="480" fill="#94a3b8" font-size="11.5" font-family="Microsoft YaHei, sans-serif">提示：暗环境 + 全黑屏幕背景提高反差比，虚像轮廓更通透无杂光</text>

  <!-- 右侧：塑料瓶物理裁切尺寸与 4 片拼合展开图 -->
  <rect x="510" y="76" width="426" height="418" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <text x="530" y="104" fill="#fde047" font-size="15" font-weight="800" font-family="Microsoft YaHei, sans-serif">二、透明塑料瓶等腰梯形裁切纸样（剪 4 片粘合）</text>

  <!-- 单片尺寸放样 (1cm : 6cm : 3.5cm，放大比例 1cm = 38px) -->
  <!-- 上底 1cm = 38px, 下底 6cm = 228px, 斜高 3.5cm = 133px -->
  <polygon points="694,160 732,160 827,293 599,293" fill="#38bdf8" fill-opacity="0.20" stroke="#4ade80" stroke-width="2.5"/>
  <!-- 上底 1cm 标尺 -->
  <line x1="694" y1="145" x2="732" y2="145" stroke="#4ade80" stroke-width="2"/>
  <text x="713" y="138" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="800" font-family="Microsoft YaHei, sans-serif">上底 = 1.0 cm</text>
  <!-- 下底 6cm 标尺 -->
  <line x1="599" y1="312" x2="827" y2="312" stroke="#fde047" stroke-width="2"/>
  <text x="713" y="330" text-anchor="middle" fill="#fde047" font-size="13" font-weight="800" font-family="Microsoft YaHei, sans-serif">下底 = 6.0 cm</text>
  <!-- 梯形高 3.5cm 标尺 -->
  <line x1="713" y1="160" x2="713" y2="293" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="722" y="248" fill="#38bdf8" font-size="12.5" font-weight="800" font-family="Microsoft YaHei, sans-serif">高 3.5 cm</text>
  <!-- 斜边长度 -->
  <text x="588" y="218" text-anchor="end" fill="#94a3b8" font-size="11.5" font-family="Microsoft YaHei, sans-serif">斜腰 ≈ 4.30 cm</text>

  <!-- 制作步骤卡 -->
  <rect x="530" y="348" width="386" height="128" rx="10" fill="#111b2e" stroke="#334155"/>
  <text x="546" y="372" fill="#f8fafc" font-size="13" font-weight="800" font-family="Microsoft YaHei, sans-serif">DIY 步骤清单（实测塑料瓶零成本复刻）：</text>
  <text x="546" y="395" fill="#cbd5e1" font-size="12" font-family="Microsoft YaHei, sans-serif">1. 选取大号透明平滑塑料饮料瓶（截取四壁平整无凹凸中段）。</text>
  <text x="546" y="416" fill="#cbd5e1" font-size="12" font-family="Microsoft YaHei, sans-serif">2. 裁出 4 片相同梯形：<tspan fill="#4ade80" font-weight="700">上底 1cm · 下底 6cm · 高 3.5cm</tspan>。</text>
  <text x="546" y="437" fill="#cbd5e1" font-size="12" font-family="Microsoft YaHei, sans-serif">3. 四片斜腰用细透明胶带对齐粘成倒四棱台（折合倾角 44.4°）。</text>
  <text x="546" y="458" fill="#fde047" font-size="12" font-weight="700" font-family="Microsoft YaHei, sans-serif">4. 将小口 (1cm) 朝下放置手机屏幕中央，无金字塔也可切「单图模式」！</text>
</svg>
