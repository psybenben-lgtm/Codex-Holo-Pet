<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <defs>
    <linearGradient id="bgFb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="440" rx="16" fill="url(#bgFb)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-size="19.5" font-weight="800" font-family="Microsoft YaHei, PingFang SC, sans-serif">空白电脑零权限与无外设无缝降级指南（怎么玩都不会卡死报错）</text>
  <text x="480" y="58" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-family="Microsoft YaHei, sans-serif">纯本地运行 · 不传云端 · 即使电脑未装 Codex CLI、无摄像头、不想给读键盘权限、没塑料全息罩也全部可玩</text>

  <!-- 5 个场景行卡片 -->
  <!-- Card 1 -->
  <rect x="30" y="80" width="900" height="62" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52" y="107" fill="#38bdf8" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">1. 没装 Codex CLI / GPT 桌面端</text>
  <text x="52" y="128" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei, sans-serif">卡点：本机找不到 ~/.codex/sessions 记录</text>
  <text x="380" y="117" fill="#fde047" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">➜ 自动降级不报错：</text>
  <text x="545" y="107" fill="#f8fafc" font-size="12.5" font-weight="700" font-family="Microsoft YaHei, sans-serif">工作台自动提示未检测到，可直接点「模拟工作中 / 空闲」</text>
  <text x="545" y="128" fill="#4ade80" font-size="12" font-family="Microsoft YaHei, sans-serif">倒咖啡、打工罢工、搓澡与羽毛球全部正常触发！</text>

  <!-- Card 2 -->
  <rect x="30" y="152" width="900" height="62" rx="12" fill="#111827" stroke="#4ade80" stroke-width="1.5"/>
  <text x="52" y="179" fill="#4ade80" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">2. 不开摄像头 / 无摄像头 / 未装 OpenCV</text>
  <text x="52" y="200" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei, sans-serif">卡点：担心摄像头隐私或电脑无相机</text>
  <text x="380" y="189" fill="#fde047" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">➜ 零权限纯鼠标方案：</text>
  <text x="545" y="179" fill="#f8fafc" font-size="12.5" font-weight="700" font-family="Microsoft YaHei, sans-serif">仅用普通鼠标光标替代五指与球拍，甩动鼠标即可挥拍/扣杀</text>
  <text x="545" y="200" fill="#4ade80" font-size="12" font-family="Microsoft YaHei, sans-serif">只需极简 Pillow 即可启动，免安装 200MB 视觉 AI 包！</text>

  <!-- Card 3 -->
  <rect x="30" y="224" width="900" height="62" rx="12" fill="#111827" stroke="#c084fc" stroke-width="1.5"/>
  <text x="52" y="251" fill="#c084fc" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">3. 不想给全局键盘读写权限</text>
  <text x="52" y="272" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei, sans-serif">卡点：对敲字统计有安全顾虑</text>
  <text x="380" y="261" fill="#fde047" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">➜ 隐私关闭 + 网页按键：</text>
  <text x="545" y="251" fill="#f8fafc" font-size="12.5" font-weight="700" font-family="Microsoft YaHei, sans-serif">工作台一键切换「关读键盘·纯按钮」即卸载本机键盘监听</text>
  <text x="545" y="272" fill="#4ade80" font-size="12" font-family="Microsoft YaHei, sans-serif">挖土/暴怒甩泥/推浴缸/调温/海绵搓澡均有网页按钮一步触发！</text>

  <!-- Card 4 -->
  <rect x="30" y="296" width="900" height="62" rx="12" fill="#111827" stroke="#fb923c" stroke-width="1.5"/>
  <text x="52" y="323" fill="#fb923c" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">4. 手边没有 1×6×3.5cm 塑料金字塔</text>
  <text x="52" y="344" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei, sans-serif">卡点：四面倒置画面没棱锥不好直接看</text>
  <text x="380" y="333" fill="#fde047" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">➜ 单图直看免棱镜模式：</text>
  <text x="545" y="323" fill="#f8fafc" font-size="12.5" font-weight="700" font-family="Microsoft YaHei, sans-serif">点击「单图直看」或全息页左下角切单面，立即还原清晰正立大图</text>
  <text x="545" y="344" fill="#4ade80" font-size="12" font-family="Microsoft YaHei, sans-serif">手机平放单图查看或电脑同屏看都直观清楚！</text>

  <!-- Card 5 -->
  <rect x="30" y="368" width="900" height="60" rx="12" fill="#111827" stroke="#facc15" stroke-width="1.5"/>
  <text x="52" y="395" fill="#facc15" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">5. 只有 1 台电脑、没有多余手机扫码</text>
  <text x="52" y="415" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei, sans-serif">卡点：无法搭建三屏硬件环境</text>
  <text x="380" y="405" fill="#fde047" font-size="14" font-weight="800" font-family="Microsoft YaHei, sans-serif">➜ 内置三屏联调工作台：</text>
  <text x="562" y="395" fill="#f8fafc" font-size="12.5" font-weight="700" font-family="Microsoft YaHei, sans-serif">浏览器打开主页「/」即同步呈现桌面工位+全息+交互控制三画面</text>
  <text x="562" y="415" fill="#4ade80" font-size="12" font-family="Microsoft YaHei, sans-serif">电脑直接操作、桌面透明小人同步动，零手机也能 100% 体验！</text>
</svg>
